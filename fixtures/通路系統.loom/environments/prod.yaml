infra:
- id: f5-前台
  slug: f5-前台
  endpoints:
  - id: ep-f5-前台
    slug: vip
    protocol: tcp
    address: 203.0.113.10:443
- id: f5-apigw
  slug: f5-api-gateway
  endpoints:
  - id: ep-f5-apigw
    slug: vip
    protocol: tcp
    address: 10.1.0.20:8443
connections:
- id: conn-prod-01
  serves: r-使用者-連-apache
  purpose: 使用者連上對外的 VIP
  from: !person
    person: p-使用者
  to: !infra
    node: f5-前台
    endpoint: ep-f5-前台
- id: conn-prod-02
  serves: r-使用者-連-apache
  purpose: F5 分流到反向代理
  from: !infra
    node: f5-前台
    endpoint: ep-f5-前台
  to: !instance
    target: !pattern
      slug_pattern: apache-*
      expect: 3
    endpoint: e-apache
- id: conn-prod-03
  serves: r-apache-連-gateway
  purpose: 反向代理轉送給 Gateway
  from: !instance
    target: !pattern
      slug_pattern: apache-*
      expect: 3
  to: !instance
    target: !pattern
      slug_pattern: gateway-*
      expect: 3
    endpoint: e-gateway
- id: conn-prod-04
  serves: r-gateway-連-consul
  purpose: 查詢 Channel Service 的位置
  from: !instance
    target: !pattern
      slug_pattern: gateway-*
      expect: 3
  to: !instance
    target: !pattern
      slug_pattern: consul-*
      expect: 6
    endpoint: e-consul
- id: conn-prod-05
  serves: r-channel-連-consul
  purpose: 啟動時註冊自己
  from: !instance
    target: !pattern
      slug_pattern: channel-*
      expect: 3
  to: !instance
    target: !pattern
      slug_pattern: consul-*
      expect: 6
    endpoint: e-consul
- id: conn-prod-06
  serves: r-gateway-連-channel
  purpose: 同中心優先（主中心）
  from: !instance
    target: !pattern
      slug_pattern: gateway-*
      within: n-prod-dc-主中心
      expect: 2
  to: !instance
    target: !pattern
      slug_pattern: channel-*
      within: n-prod-dc-主中心
      expect: 2
    endpoint: e-channel
- id: conn-prod-07
  serves: r-gateway-連-channel
  purpose: 同中心優先（異地）
  from: !instance
    target: !pattern
      slug_pattern: gateway-*
      within: n-prod-dc-異地
      expect: 1
  to: !instance
    target: !pattern
      slug_pattern: channel-*
      within: n-prod-dc-異地
      expect: 1
    endpoint: e-channel
- id: conn-prod-08
  serves: r-gateway-連-channel
  purpose: 跨中心備援：主中心 → 異地
  kind: fallback
  from: !instance
    target: !pattern
      slug_pattern: gateway-*
      within: n-prod-dc-主中心
      expect: 2
  to: !instance
    target: !pattern
      slug_pattern: channel-*
      within: n-prod-dc-異地
      expect: 1
    endpoint: e-channel
- id: conn-prod-09
  serves: r-gateway-連-channel
  purpose: 跨中心備援：異地 → 主中心
  kind: fallback
  from: !instance
