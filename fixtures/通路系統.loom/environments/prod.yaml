      within: n-prod-dc-主中心
      expect: 2
    endpoint: e-channel
- id: conn-prod-10
  serves: r-channel-連-redis
  purpose: 讀寫 Session
  from: !instance
    target: !pattern
      slug_pattern: channel-*
      expect: 3
  to: !instance
    target: !pattern
      slug_pattern: redis-*
      expect: 6
    endpoint: e-redis
- id: conn-prod-11
  serves: r-channel-連-apigw
  purpose: 先送到 API Gateway 的 VIP
  from: !instance
    target: !pattern
      slug_pattern: channel-*
      expect: 3
  to: !infra
