id: env-test
slug: test
name: 測試環境
nodes:
- id: n-test-api-01
  slug: vm-api-01
  kind: virtual-machine
  instances:
  - id: i-test-api-01
    slug: api-01
    container: c-order-api
    endpoints:
    - id: ep-test-api-01
      slug: client-port
      def: e-api-egress
      protocol: tcp
      address: 10.1.0.5:8080
- id: n-test-redis-01
  slug: vm-redis-01
  kind: virtual-machine
  instances:
  - id: i-test-redis-01
    slug: redis-01
    container: c-redis
    endpoints:
    - id: ep-test-redis-01
      slug: client-port
      def: e-redis-client
      protocol: tcp
      address: 10.1.1.11:6379
- id: n-test-redis-02
  slug: vm-redis-02
  kind: virtual-machine
  instances:
  - id: i-test-redis-02
    slug: redis-02
    container: c-redis
    endpoints:
    - id: ep-test-redis-02
      slug: client-port
      def: e-redis-client
      protocol: tcp
      address: 10.1.1.12:6379
systems:
- id: sys-test-payment
  slug: payment-sandbox
  system: s-payment
  endpoints:
  - id: ep-test-payment
    slug: https
    def: e-pay-https
    protocol: tcp
    address: https://sandbox.pay.example.com
connections:
- id: conn-test-1
  serves: r-api-快取
  purpose: ''
  from: !instance
    target: !one i-test-api-01
  to: !instance
    target: !pattern
      slug_pattern: redis-*
      expect: 2
    endpoint: e-redis-client
- id: conn-test-pay
  serves: r-api-金流
  purpose: 送出付款請求
  from: !instance
    target: !one i-test-api-01
  to: !system
    instance: sys-test-payment
    endpoint: e-pay-https
