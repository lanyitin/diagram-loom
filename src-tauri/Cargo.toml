# Tauri 殼。刻意很薄——它只做轉接，不做判斷。
#
# 所有規則都在 loom-core，那裡可以用 cargo test 驗證，不必開視窗。
# 這裡的每個 command 都應該短到「一眼看得出它沒有偷做決定」。
[package]
name = "diagram-loom"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
# 這個 crate 有兩支 bin（App 與型別產生器），要說清楚 cargo run 該跑哪個。
default-run = "diagram-loom"

[lib]
# Tauri 的行動平台支援需要 lib target；桌面版也照這個結構走。
name = "diagram_loom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
loom-core = { path = "../crates/loom-core", features = ["specta"] }
loom-mcp = { path = "../crates/loom-mcp" }
serde = { version = "1", features = ["derive"] }
specta = { version = "2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-specta = { version = "2.0.0-rc.25", features = ["derive", "typescript"] }

serde_json = "1"
tokio = { version = "1", features = ["net", "rt"] }
rmcp = { version = "3.1.2", default-features = false, features = ["server", "macros", "schemars", "transport-streamable-http-server", "transport-streamable-http-server-session", "tower"] }

# macOS 的「智慧型引號／破折號／文字替換／自動拼字修正」是**系統層**的，
# HTML 屬性關不掉。要關只能動 NSUserDefaults，那需要講 Objective-C。
# Tauri 本來就把 objc2 拉進來了，這裡只是把它變成直接相依。
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSUserDefaults",
  "NSString",
] }

[dev-dependencies]
# 只有權限檔的守門測試用得到。
serde_json = "1"
