<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>maxGraph 編輯器原型</title>
<style>
  :root {
    --rule: #d8d5cf; --ink: #2b2b2b; --ink-2: #5a5754; --ink-3: #8a8783;
    --warp: #b4552d; --surface: #faf8f4; --surface-2: #f2efe9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: grid;
    grid-template-rows: auto 1fr auto;
    font: 13px/1.6 system-ui, "Noto Sans TC", sans-serif; color: var(--ink);
  }

  /* ── 工具列 ── */
  .toolbar { display: flex; align-items: center; gap: 2px; padding: 5px 8px;
    border-bottom: 1px solid var(--rule); background: var(--surface-2); }
  .toolbar button { min-width: 28px; height: 26px; padding: 0 7px; border: 1px solid transparent;
    border-radius: 4px; background: none; font: inherit; font-size: 13px; cursor: pointer; }
  .toolbar button:hover { background: #fff; border-color: var(--rule); }
  .sep { width: 1px; height: 18px; margin: 0 5px; background: var(--rule); }

  /* ── 中間 ── */
  main { display: grid; grid-template-columns: 168px 1fr 268px; min-height: 0; }
  /*
   * 背景格線是**畫布自己的 background**，不是一層蓋在上面的 div。
   *
   * ⚠️ 用 div 會蓋住圖：那個 div 是 absolute、maxGraph 的 <svg> 是 static，
   * 而定位過的元素會畫在未定位的內容之上——**跟 DOM 順序無關**。
   * 元素的 background 則永遠畫在自己的子孫底下，不會有這個問題。
   *
   * 尺寸與位移由 JS 跟著 view 的縮放與平移更新。
   */
  #canvas { position: relative; overflow: hidden;
    background-color: var(--surface);
    background-image:
      linear-gradient(to right, #e6e2da 1px, transparent 1px),
      linear-gradient(to bottom, #e6e2da 1px, transparent 1px); }

  /* 形狀庫 */
  #shapes { border-right: 1px solid var(--rule); overflow-y: auto; background: #fff; padding-bottom: 12px; }
  #shapes h2 { margin: 0; padding: 8px 10px 4px; position: sticky; top: 0; background: #fff; }
  .palette { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; padding: 0 8px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 2px;
    border: 1px solid transparent; border-radius: 5px; background: none; cursor: grab;
    font: inherit; font-size: 10.5px; color: var(--ink-3); }
  .tile:hover { border-color: var(--warp); color: var(--warp); background: #fff; }
  .tile .preview { width: 50px; height: 38px; overflow: hidden; pointer-events: none; }
  aside { border-left: 1px solid var(--rule); overflow-y: auto; background: #fff; }

  /* ── 大綱：浮在畫布右下角 ── */
  #outline { position: absolute; right: 10px; bottom: 10px; width: 170px; height: 120px;
    border: 1px solid var(--rule); border-radius: 4px; background: #fff;
    box-shadow: 0 3px 12px color-mix(in srgb, #000 12%, transparent); overflow: hidden; }

  /* ── 面板 ── */
  .group { padding: 8px 10px; border-bottom: 1px solid var(--rule); }
  .group[hidden] { display: none; }
  h2 { margin: 0 0 6px; font-size: 11px; font-weight: 600; color: var(--ink-3);
    text-transform: uppercase; letter-spacing: .05em; }
  .row { display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
  .row .label { flex: none; width: 52px; font-size: 12px; color: var(--ink-2); }
  .empty { padding: 14px 10px; margin: 0; color: var(--ink-3); font-size: 12px; }

  input, select, .toggle { font: inherit; font-size: 12px; height: 24px;
    border: 1px solid var(--rule); border-radius: 4px; background: #fff; padding: 0 4px; }
  select { flex: 1; min-width: 0; }
  .num { text-align: right; }
  .colorwrap { display: inline-flex; align-items: center; gap: 3px; }
  input.color { width: 30px; height: 24px; padding: 1px; }
  input.none { width: 13px; height: 13px; }
  .toggle { min-width: 26px; cursor: pointer; }
  .toggle[aria-pressed="true"] { background: var(--warp); border-color: var(--warp); color: #fff; }
  .actions { display: flex; flex-wrap: wrap; gap: 3px; }
  .actions button { min-width: 26px; height: 24px; font: inherit; font-size: 12px;
    border: 1px solid var(--rule); border-radius: 4px; background: #fff; cursor: pointer; }
  .actions button:hover { border-color: var(--warp); color: var(--warp); }

  /* ── 模型面板 ── */
  #model ul { list-style: none; margin: 0; padding: 0; }
  #model li { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
  #model li span { flex: 1; }
  #model .picked { color: var(--warp); font-weight: 600; }
  #model button { font: inherit; font-size: 11.5px; height: 22px; padding: 0 7px;
    border: 1px solid var(--rule); border-radius: 4px; background: #fff; cursor: pointer; }
  #model button:disabled { opacity: .45; cursor: default; }

  /* ── 編輯資料的對話框 ── */
  .modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
    background: color-mix(in srgb, #000 28%, transparent); }
  .dialog { width: 420px; max-height: 76vh; overflow-y: auto; padding: 14px;
    border-radius: 8px; background: #fff; box-shadow: 0 12px 40px color-mix(in srgb, #000 30%, transparent); }
  .dialog h2 { margin: 0 0 10px; font-size: 13px; color: var(--ink); text-transform: none; letter-spacing: 0; }
  .metarow { display: flex; gap: 5px; margin-bottom: 5px; }
  .metarow .key { width: 116px; }
  .metarow .value { flex: 1; min-width: 0; }
  .metarow.reserved .key { background: var(--surface-2); color: var(--warp); font-weight: 600; }
  .metarow .x { width: 24px; border: 1px solid var(--rule); border-radius: 4px;
    background: #fff; cursor: pointer; color: var(--ink-3); }
  .dialog .add { margin-top: 6px; border: 1px dashed var(--rule); border-radius: 4px;
    background: none; padding: 4px 8px; cursor: pointer; font: inherit; font-size: 12px; color: var(--ink-3); }
  .dialog .foot { display: flex; justify-content: flex-end; gap: 6px; margin-top: 14px; }
  .dialog .foot button { height: 26px; padding: 0 12px; border: 1px solid var(--rule);
    border-radius: 4px; background: #fff; cursor: pointer; font: inherit; font-size: 12px; }
  .dialog .foot .primary { background: var(--warp); border-color: var(--warp); color: #fff; }

  /* ── 狀態列 ── */
  #status { padding: 4px 10px; border-top: 1px solid var(--rule); background: var(--surface-2);
    font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div id="bar"></div>
  <main>
    <div id="shapes"></div>
    <div id="canvas"><div id="outline"></div></div>
    <aside>
      <div id="format"></div>
      <section class="group" id="model">
        <h2>標註（模型）</h2>
        <ul id="targets"></ul>
      </section>
    </aside>
  </main>
  <div id="status"></div>
  <script type="module" src="/src/editor/main.mjs"></script>
</body>
</html>
